name: Validate Extensions

on:
  pull_request:
    paths:
      - 'index.json'
      - 'javascript/**/*.js'
  push:
    branches:
      - main
    paths:
      - 'index.json'
      - 'javascript/**/*.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Validate index.json
        run: node validate-index.js
      
      - name: Test extensions
        run: node test-extensions.js
      
      - name: Check for common issues
        run: |
          echo "Checking for forbidden dependencies..."
          
          # Check for CryptoJS usage
          if grep -r "CryptoJS\." javascript/ --include="*.js"; then
            echo "❌ ERROR: CryptoJS is not available in Mangayomi runtime"
            echo "Use Mangayomi bridge functions instead:"
            echo "  - encryptAESCryptoJS(plainText, passphrase)"
            echo "  - decryptAESCryptoJS(encrypted, passphrase)"
            exit 1
          fi
          
          # Check for require/import
          if grep -r "require(" javascript/ --include="*.js" | grep -v "^//"; then
            echo "❌ ERROR: require() is not available in QuickJS"
            exit 1
          fi
          
          if grep -r "^import " javascript/ --include="*.js"; then
            echo "❌ ERROR: ES6 imports are not available in QuickJS"
            exit 1
          fi
          
          echo "✅ No forbidden dependencies found"
      
      - name: Validate JSON syntax
        run: |
          echo "Validating JSON files..."
          find . -name "*.json" -type f | while read file; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ ERROR: Invalid JSON in $file"
              exit 1
            fi
          done
          echo "✅ All JSON files valid"
